<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<title>M2D — Team</title>
<style>
  :root {
    --accent: #3b82f6;
    --accent-2: #60a5fa;
    --text: #e9ebf2;
    --text-dim: #9aa2b5;
    --glass-bg: rgba(18, 22, 36, 0.38);
    --glass-border: rgba(255, 255, 255, 0.10);
    --radius: 18px;
    --shadow: 0 12px 44px rgba(0, 0, 0, 0.55);
    --blur: 26px;
    --base-bg: #050710;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: "Segoe UI", system-ui, -apple-system, "Inter", Roboto, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  body {
    background: var(--base-bg);
    position: relative;
    overflow-x: hidden;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Слой 0: большие тёмно-синие пятна ---------- */
  .bg-blobs {
    position: fixed; inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
    will-change: transform;
  }
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(110px);
    opacity: 0.7;
    will-change: transform;
  }
  .b1 { width: 700px; height: 700px; background: #0a3d91; top: -180px; left: -150px; animation: drift1 26s ease-in-out infinite; }
  .b2 { width: 620px; height: 620px; background: #0d47a1; top: 18%;  right: -200px; animation: drift2 32s ease-in-out infinite; }
  .b3 { width: 560px; height: 560px; background: #0a2a6b; bottom: -180px; left: 12%; animation: drift3 28s ease-in-out infinite; }
  .b4 { width: 500px; height: 500px; background: #1565c0; bottom: 6%;  right: 8%;   animation: drift1 30s ease-in-out infinite reverse; opacity: 0.6; }
  .b5 { width: 440px; height: 440px; background: #0f3580; top: 42%;   left: 32%;  animation: drift2 24s ease-in-out infinite reverse; opacity: 0.65; }
  .b6 { width: 380px; height: 380px; background: #0a1a4a; top: 60%;   left: 5%;   animation: drift3 34s ease-in-out infinite reverse; opacity: 0.85; }

  @keyframes drift1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    25%      { transform: translate(70px, -50px) scale(1.10); }
    50%      { transform: translate(-40px, 60px) scale(0.94); }
    75%      { transform: translate(50px, 30px) scale(1.05); }
  }
  @keyframes drift2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33%      { transform: translate(-80px, -40px) scale(1.12); }
    66%      { transform: translate(60px, 70px) scale(0.90); }
  }
  @keyframes drift3 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(90px, -60px) scale(1.08); }
  }

  /* ---------- Слой 0: звёздное поле ---------- */
  .bg-stars {
    position: fixed; inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }
  .star {
    position: absolute;
    top: 0; left: 0;
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(200, 225, 255, 0.95) 0%,
      rgba(110, 165, 255, 0.40) 45%,
      transparent 78%);
    box-shadow: 0 0 10px rgba(130, 180, 255, 0.55);
    will-change: transform, opacity, filter;
    pointer-events: none;
  }

  /* ---------- Слой 1: свечение курсора ---------- */
  .cursor-glow {
    position: fixed; top: 0; left: 0;
    width: 460px; height: 460px;
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(80, 145, 255, 0.26) 0%,
      rgba(45, 95, 210, 0.12) 40%,
      rgba(20, 45, 120, 0.04) 65%,
      transparent 75%);
    filter: blur(28px);
    mix-blend-mode: screen;
    pointer-events: none;
    z-index: 1;
    will-change: transform;
  }

  /* ---------- Boot screen ---------- */
  #boot {
    position: fixed; inset: 0;
    background: #050710;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: opacity 0.7s ease, visibility 0.7s ease;
  }
  #boot.hidden {
    opacity: 0;
    visibility: hidden;
  }
  .boot-inner {
    text-align: center;
  }
  .boot-logo {
    font-size: 3.2rem;
    font-weight: 900;
    letter-spacing: -0.04em;
    color: #fff;
    text-shadow: 0 0 60px rgba(96, 165, 250, 0.7);
    animation: bootLogo 1.6s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  @keyframes bootLogo {
    0%   { opacity: 0; transform: scale(0.85); filter: blur(10px); }
    100% { opacity: 1; transform: scale(1);    filter: blur(0);    }
  }
  .boot-sub {
    font-size: 0.85rem;
    letter-spacing: 0.4em;
    color: var(--text-dim);
    margin-top: 6px;
    animation: bootSub 1.4s 0.2s ease both;
  }
  @keyframes bootSub {
    from { opacity: 0; letter-spacing: 0.8em; }
    to   { opacity: 1; letter-spacing: 0.4em; }
  }
  .boot-bar {
    width: 220px;
    height: 3px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 999px;
    overflow: hidden;
    margin: 26px auto 0;
  }
  .boot-bar span {
    display: block;
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #3b82f6, #93c5fd);
    border-radius: 999px;
    box-shadow: 0 0 14px rgba(96, 165, 250, 0.9);
    animation: bootProgress 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }
  @keyframes bootProgress {
    0% { width: 0%; }
    60% { width: 70%; }
    100% { width: 100%; }
  }

  /* ---------- Micro-loader ---------- */
  #loader {
    position: fixed;
    top: 0; left: 0;
    height: 2px;
    width: 0%;
    background: linear-gradient(90deg, #3b82f6, #60a5fa, #93c5fd);
    box-shadow: 0 0 14px rgba(96, 165, 250, 0.9);
    z-index: 100;
    opacity: 0;
    transition: width 0.5s ease-out, opacity 0.3s ease;
  }

  /* ---------- Glass ---------- */
  .glass {
    background: var(--glass-bg);
    backdrop-filter: blur(var(--blur)) saturate(170%);
    -webkit-backdrop-filter: blur(var(--blur)) saturate(170%);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  /* ---------- App layout ---------- */
  body > header,
  body > main,
  body > footer {
    position: relative;
    z-index: 2;
  }

  .topbar {
    position: sticky;
    top: 16px;
    margin: 16px auto 0;
    max-width: 1080px;
    width: calc(100% - 32px);
    padding: 12px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logo {
    font-weight: 800;
    font-size: 1.05rem;
    letter-spacing: -0.01em;
    color: #fff;
    cursor: pointer;
    background: linear-gradient(135deg, #93c5fd, #c4b5fd);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .topbar nav { display: flex; gap: 20px; }
  .topbar nav a {
    color: var(--text-dim);
    text-decoration: none;
    font-size: 0.95rem;
    transition: color 0.2s;
    cursor: pointer;
    position: relative;
  }
  .topbar nav a:hover { color: #fff; }
  .topbar nav a.active::after {
    content: "";
    position: absolute;
    left: 0; right: 0;
    bottom: -6px;
    height: 2px;
    background: var(--accent-2);
    border-radius: 2px;
    box-shadow: 0 0 8px var(--accent-2);
  }

  /* ---------- Stage & pages ---------- */
  #stage {
    flex: 1;
    max-width: 1080px;
    width: 100%;
    margin: 0 auto;
    padding: 20px;
    position: relative;
    min-height: 60vh;
  }
  .page {
    position: relative;
    opacity: 0;
    transform: translateY(60px) scale(0.98);
    transition: opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1),
                transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    will-change: opacity, transform;
  }
  .page.active {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  .page.exiting {
    position: absolute;
    top: 0; left: 0; right: 0;
    opacity: 0;
    transform: translateY(-30px) scale(0.98);
    pointer-events: none;
    transition: opacity 0.5s ease, transform 0.5s ease;
  }

  /* ---------- Hero ---------- */
  .hero {
    text-align: center;
    padding: 70px 20px 40px;
  }
  .hello {
    font-size: clamp(3rem, 9vw, 6rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    color: #fff;
    text-shadow: 0 0 60px rgba(96, 165, 250, 0.55),
                 0 0 20px rgba(255, 255, 255, 0.15);
    display: inline-block;
    line-height: 1;
    margin: 0 0 26px;
  }
  .tagline {
    color: var(--text-dim);
    font-size: 1.1rem;
    max-width: 640px;
    margin: 0 auto 32px;
    line-height: 1.6;
  }
  .hero-buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

  /* ---------- Hello animations ---------- */
  .hello.a-slide { animation: aSlide 1.1s cubic-bezier(0.22, 1, 0.36, 1) both; }
  @keyframes aSlide {
    0%   { clip-path: inset(100% 0 0 0); transform: translateY(20px); opacity: 0; }
    30%  { opacity: 1; }
    100% { clip-path: inset(0 0 0 0);     transform: translateY(0);    opacity: 1; }
  }

  .hello.a-draw { animation: aDraw 1.2s cubic-bezier(0.65, 0, 0.35, 1) both; }
  @keyframes aDraw {
    0%   { clip-path: inset(0 100% 0 0); }
    100% { clip-path: inset(0 0 0 0); }
  }

  .hello.a-blur { animation: aBlur 1.2s ease both; }
  @keyframes aBlur {
    0%   { filter: blur(24px); opacity: 0; transform: scale(1.08); }
    100% { filter: blur(0);    opacity: 1; transform: scale(1); }
  }

  .hello.a-scale { animation: aScale 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
  @keyframes aScale {
    0%   { opacity: 0; transform: scale(0.3) rotate(-12deg); }
    100% { opacity: 1; transform: scale(1)   rotate(0); }
  }

  .hello.a-fade { animation: aFade 1.2s ease both; }
  @keyframes aFade {
    0%   { opacity: 0; transform: translateX(-50px); filter: blur(6px); }
    100% { opacity: 1; transform: translateX(0);     filter: blur(0); }
  }

  .hello.a-flip {
    animation: aFlip 1.1s cubic-bezier(0.22, 1, 0.36, 1) both;
    transform-origin: center bottom;
  }
  @keyframes aFlip {
    0%   { opacity: 0; transform: perspective(500px) rotateX(-90deg); }
    100% { opacity: 1; transform: perspective(500px) rotateX(0); }
  }

  .hello.a-letters .char {
    display: inline-block;
    opacity: 0;
    animation: aLetter 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  @keyframes aLetter {
    0%   { opacity: 0; transform: translateY(-60px) rotate(-25deg); }
    100% { opacity: 1; transform: translateY(0)     rotate(0); }
  }

  .hello.a-typer .char {
    display: inline-block;
    opacity: 0;
    animation: aTyper 0.06s steps(1) forwards;
  }
  @keyframes aTyper {
    to { opacity: 1; }
  }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-block;
    padding: 12px 24px;
    border-radius: 12px;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
    border: 1px solid transparent;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.2s, background 0.2s;
    font-family: inherit;
  }
  .btn.primary {
    background: linear-gradient(135deg, #2563eb, #3b82f6);
    color: #fff;
    box-shadow: 0 6px 22px rgba(37, 99, 235, 0.45);
  }
  .btn.primary:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(59, 130, 246, 0.55); }
  .btn.ghost {
    background: rgba(255, 255, 255, 0.06);
    border-color: rgba(255, 255, 255, 0.14);
    color: var(--text);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  .btn.ghost:hover { background: rgba(255, 255, 255, 0.12); }

  /* ---------- Page sections ---------- */
  .page-section {
    padding: 40px;
    margin: 30px auto 40px;
    max-width: 760px;
  }
  .page-section h2 {
    font-size: 1.8rem;
    margin: 0 0 12px;
    color: #fff;
    letter-spacing: -0.01em;
  }
  .muted { color: var(--text-dim); line-height: 1.6; }

  /* ---------- Feature cards ---------- */
  .features {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-top: 24px;
  }
  .card {
    padding: 20px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 14px;
    transition: transform 0.2s, background 0.2s;
  }
  .card:hover { transform: translateY(-3px); background: rgba(255, 255, 255, 0.07); }
  .card h3 { margin: 0 0 8px; font-size: 1.05rem; color: #fff; }
  .card p  { color: var(--text-dim); margin: 0; line-height: 1.5; font-size: 0.95rem; }

  /* ---------- Form ---------- */
  form { display: flex; flex-direction: column; gap: 16px; margin-top: 20px; }
  label {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--text-dim);
  }
  input, textarea {
    font-family: inherit;
    font-size: 1rem;
    color: var(--text);
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.10);
    background: rgba(255, 255, 255, 0.05);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    resize: vertical;
  }
  input::placeholder, textarea::placeholder { color: #6b7385; }
  input:focus, textarea:focus {
    border-color: var(--accent);
    background: rgba(255, 255, 255, 0.08);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.22);
  }
  button.btn { align-self: flex-start; border: none; }
  .status { font-size: 0.9rem; margin: 4px 0 0; min-height: 1.2em; }
  .status.ok  { color: #4ade80; }
  .status.err { color: #f87171; }

  /* ---------- Contact list ---------- */
  .contact-list {
    list-style: none;
    padding: 0;
    margin: 20px 0 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .contact-list li {
    padding: 14px 18px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    color: var(--text-dim);
  }
  .contact-list strong { color: #fff; margin-right: 8px; }

  /* ---------- Footer ---------- */
  footer {
    max-width: 1080px;
    width: calc(100% - 32px);
    margin: 20px auto 24px;
    padding: 18px 24px;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 0.9rem;
    position: relative;
    z-index: 2;
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 640px) {
    .topbar { flex-direction: column; gap: 10px; }
    .topbar nav { gap: 14px; flex-wrap: wrap; justify-content: center; }
    .page-section { padding: 26px; }
    .hero { padding: 50px 10px 30px; }
  }
  @media (hover: none) {
    .cursor-glow { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .blob { animation: none !important; }
    .page, .page.exiting { transition: opacity 0.3s !important; }
  }
</style>
</head>
<body>

  <!-- Background layers -->
  <div class="bg-blobs" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
    <span class="blob b4"></span>
    <span class="blob b5"></span>
    <span class="blob b6"></span>
  </div>
  <div class="bg-stars" aria-hidden="true"></div>
  <div class="cursor-glow" aria-hidden="true"></div>

  <!-- Boot screen -->
  <div id="boot">
    <div class="boot-inner">
      <div class="boot-logo">M2D</div>
      <div class="boot-sub">TEAM</div>
      <div class="boot-bar"><span></span></div>
    </div>
  </div>

  <!-- Micro loader -->
  <div id="loader"></div>

  <!-- App -->
  <header class="topbar glass">
    <div class="logo" data-nav="home">M2D — Team</div>
    <nav>
      <a href="#home"     data-nav="home">Home</a>
      <a href="#features" data-nav="features">Features</a>
      <a href="#apply"    data-nav="apply">Apply</a>
      <a href="#contact"  data-nav="contact">Contact</a>
    </nav>
  </header>

  <main id="stage"></main>

  <footer class="glass">
    <span>© 2026 M2D — Team</span>
    <span class="muted">Built with glass, blur &amp; motion</span>
  </footer>

  <script>
  /* ==========================================================
     BACKGROUND: cursor glow + parallax + stars
     ========================================================== */
  (() => {
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const bgBlobs = document.querySelector('.bg-blobs');
    const starLayer = document.querySelector('.bg-stars');
    const glow = document.querySelector('.cursor-glow');

    let mx = window.innerWidth / 2, my = window.innerHeight / 2;
    let gx = mx, gy = my;
    let pdx = 0, pdy = 0;

    document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
    document.addEventListener('touchmove', e => {
      if (e.touches.length) { mx = e.touches[0].clientX; my = e.touches[0].clientY; }
    }, { passive: true });

    document.addEventListener('mousedown', () => glow.style.filter = 'blur(28px) brightness(1.6)');
    document.addEventListener('mouseup',   () => glow.style.filter = 'blur(28px) brightness(1)');
    document.addEventListener('touchstart', () => glow.style.filter = 'blur(28px) brightness(1.6)', { passive: true });
    document.addEventListener('touchend',   () => glow.style.filter = 'blur(28px) brightness(1)', { passive: true });

    // ---- Stars ----
    const STAR_COUNT = 120;
    const stars = [];

    function buildStars() {
      starLayer.innerHTML = '';
      stars.length = 0;
      const W = window.innerWidth, H = window.innerHeight;

      for (let i = 0; i < STAR_COUNT; i++) {
        const el = document.createElement('span');
        el.className = 'star';
        const r = Math.random();
        const size = r < 0.6 ? 2 + Math.random() * 3
                   : r < 0.9 ? 5 + Math.random() * 3
                   :           8 + Math.random() * 5;
        el.style.width = size + 'px';
        el.style.height = size + 'px';
        starLayer.appendChild(el);

        stars.push({
          el, size,
          baseX: Math.random() * W,
          baseY: Math.random() * H,
          ax: 20 + Math.random() * 55,
          ay: 20 + Math.random() * 55,
          sx: 0.12 + Math.random() * 0.25,
          sy: 0.12 + Math.random() * 0.25,
          px: Math.random() * Math.PI * 2,
          py: Math.random() * Math.PI * 2,
          twSpeed: 0.4 + Math.random() * 0.8,
          twPhase: Math.random() * Math.PI * 2,
          baseOpacity: 0.45 + Math.random() * 0.45,
        });
      }
    }
    buildStars();

    let rt;
    window.addEventListener('resize', () => {
      clearTimeout(rt);
      rt = setTimeout(buildStars, 200);
    });

    const startTime = performance.now();

    function tick() {
      const t = (performance.now() - startTime) / 1000;

      gx += (mx - gx) * 0.10;
      gy += (my - gy) * 0.10;
      glow.style.transform = `translate3d(${gx}px, ${gy}px, 0) translate(-50%, -50%)`;

      if (!reduce) {
        const tx = -((mx / window.innerWidth) - 0.5) * 40;
        const ty = -((my / window.innerHeight) - 0.5) * 40;
        pdx += (tx - pdx) * 0.06;
        pdy += (ty - pdy) * 0.06;
        bgBlobs.style.transform = `translate3d(${pdx}px, ${pdy}px, 0)`;
      }

      for (const s of stars) {
        let x, y;
        if (reduce) { x = s.baseX; y = s.baseY; }
        else {
          x = s.baseX + Math.sin(t * s.sx + s.px) * s.ax;
          y = s.baseY + Math.cos(t * s.sy + s.py) * s.ay;
        }
        const twinkle = 0.65 + Math.sin(t * s.twSpeed + s.twPhase) * 0.35;
        const d = Math.hypot(x - mx, y - my);
        const near = Math.max(0, 1 - d / 190);
        const bright = 1 + near * 2.6;
        const scale  = 1 + near * 0.9;
        const op     = Math.min(1, s.baseOpacity * twinkle + near * 0.55);

        s.el.style.transform =
          `translate3d(${x - s.size / 2}px, ${y - s.size / 2}px, 0) scale(${scale.toFixed(2)})`;
        s.el.style.opacity = op.toFixed(3);
        s.el.style.filter  = `brightness(${bright.toFixed(2)})`;
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  })();

  /* ==========================================================
     PAGES: in-memory (RAM) page system
     ========================================================== */
  const PAGES = {
    home: `
      <section class="hero">
        <h1 class="hello">Hello</h1>
        <p class="tagline">We are M2D — Team. We build elegant interfaces with glass, blur and motion.</p>
        <div class="hero-buttons">
          <a href="#apply" data-nav="apply" class="btn primary">Send a request</a>
          <a href="#features" data-nav="features" class="btn ghost">Explore</a>
        </div>
      </section>
    `,
    features: `
      <section class="page-section glass">
        <h2>What we do</h2>
        <p class="muted">M2D — Team crafts clean, modern and fast web experiences.</p>
        <div class="features">
          <article class="card">
            <h3>Fast</h3>
            <p>Single file, no dependencies. Pure HTML, CSS and JS.</p>
          </article>
          <article class="card">
            <h3>Beautiful</h3>
            <p>Dark glass, backdrop blur, star field and smooth motion.</p>
          </article>
          <article class="card">
            <h3>SPA</h3>
            <p>In-memory page cache: instant navigation after the first visit.</p>
          </article>
        </div>
      </section>
    `,
    apply: `
      <section class="page-section glass">
        <h2>Send a request</h2>
        <p class="muted">Fill in the fields and we'll get back to you.</p>
        <form novalidate>
          <label>Name
            <input name="name" type="text" placeholder="Your name" required />
          </label>
          <label>Email
            <input name="email" type="email" placeholder="you@example.com" required />
          </label>
          <label>Message
            <textarea name="message" rows="4" placeholder="How can we help?" required></textarea>
          </label>
          <button type="submit" class="btn primary">Send</button>
          <p class="status" role="status"></p>
        </form>
      </section>
    `,
    contact: `
      <section class="page-section glass">
        <h2>Contact</h2>
        <p class="muted">Reach out to the M2D team.</p>
        <ul class="contact-list">
          <li><strong>Email:</strong> team@m2d.dev</li>
          <li><strong>GitHub:</strong> github.com/m2d-team</li>
          <li><strong>Telegram:</strong> @m2d_team</li>
        </ul>
      </section>
    `,
  };

  const stage = document.getElementById('stage');
  const pageCache = new Map();   // slug -> DOM element (RAM cache)
  let currentSlug = null;
  let navLock = false;

  const delay = ms => new Promise(r => setTimeout(r, ms));

  /* ---------- Build a page DOM element once, cache in RAM ---------- */
  function buildPage(slug) {
    const el = document.createElement('div');
    el.className = 'page';
    el.dataset.slug = slug;
    el.innerHTML = PAGES[slug];

    // Wire up the form if it's the apply page
    if (slug === 'apply') {
      const form = el.querySelector('form');
      if (form) form.addEventListener('submit', handleSubmit);
    }
    return el;
  }

  /* ---------- Apply-inner-event-delegation for data-nav ---------- */
  document.addEventListener('click', e => {
    const link = e.target.closest('[data-nav]');
    if (!link) return;
    e.preventDefault();
    const slug = link.dataset.nav;
    if (slug) navigate(slug);
  });

  /* ---------- Micro loader ---------- */
  const loader = document.getElementById('loader');
  function showLoader() {
    loader.style.transition = 'width 0.4s ease-out, opacity 0.15s ease';
    loader.style.opacity = '1';
    loader.style.width = '0%';
    requestAnimationFrame(() => {
      loader.style.width = '70%';
    });
  }
  function hideLoader() {
    loader.style.width = '100%';
    setTimeout(() => {
      loader.style.opacity = '0';
      setTimeout(() => {
        loader.style.transition = 'none';
        loader.style.width = '0%';
      }, 300);
    }, 200);
  }

  /* ---------- Swap a page into the stage with animation ---------- */
  function swapTo(newPage) {
    // Clean up any lingering exiting pages
    stage.querySelectorAll('.page.exiting').forEach(el => el.remove());

    const oldPage = stage.querySelector('.page.active');
    if (oldPage && oldPage !== newPage) {
      oldPage.classList.remove('active');
      oldPage.classList.add('exiting');
      setTimeout(() => { if (oldPage.parentNode) oldPage.remove(); }, 700);
    }

    // Remove the new page if it's already somewhere (re-cache case)
    if (newPage.parentNode) newPage.remove();

    // Reset classes — the page starts hidden, ready to animate in
    newPage.classList.remove('active', 'exiting');

    stage.appendChild(newPage);
    void newPage.offsetWidth;         // force reflow so transition triggers

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        newPage.classList.add('active');
      });
    });

    activatePage(newPage);
  }

  /* ---------- Page activation: reset form state, replay Hello ---------- */
  function activatePage(page) {
    const form = page.querySelector('form');
    if (form) {
      form.reset();
      const status = form.querySelector('.status');
      if (status) { status.textContent = ''; status.className = 'status'; }
    }
    playHelloAnimation(page);

    // Update nav active state
    document.querySelectorAll('.topbar nav a').forEach(a => {
      a.classList.toggle('active', a.dataset.nav === page.dataset.slug);
    });
  }

  /* ---------- "Hello" random animation ---------- */
  function playHelloAnimation(page) {
    const hello = page.querySelector('.hello');
    if (!hello) return;

    hello.className = 'hello';
    hello.textContent = 'Hello';

    const styles = ['a-slide', 'a-blur', 'a-scale', 'a-letters', 'a-typer', 'a-draw', 'a-fade', 'a-flip'];
    const pick = styles[Math.floor(Math.random() * styles.length)];

    if (pick === 'a-letters' || pick === 'a-typer') {
      hello.textContent = '';
      [...'Hello'].forEach((ch, i) => {
        const span = document.createElement('span');
        span.className = 'char';
        span.textContent = ch;
        span.style.animationDelay = pick === 'a-letters'
          ? (i * 0.08) + 's'
          : (i * 0.14) + 's';
        hello.appendChild(span);
      });
    }

    void hello.offsetWidth;
    hello.classList.add(pick);
  }

  /* ---------- Navigate ---------- */
  async function navigate(slug, opts = {}) {
    if (navLock) return;
    if (slug === currentSlug && !opts.force) return;
    if (!PAGES[slug]) slug = 'home';

    navLock = true;
    showLoader();

    let page = pageCache.get(slug);
    if (!page) {
      // Not in RAM yet — simulate a fetch
      await delay(650);
      page = buildPage(slug);
      pageCache.set(slug, page);
    } else {
      // Already in RAM — tiny pause for visual feedback
      await delay(140);
    }

    swapTo(pageCache.get(slug));
    currentSlug = slug;
    hideLoader();

    if (opts.pushHistory !== false) {
      history.pushState({ slug }, '', '#' + slug);
    }

    window.scrollTo({ top: 0, behavior: 'smooth' });

    setTimeout(() => { navLock = false; }, 700);
  }

  /* ---------- Browser back / forward ---------- */
  window.addEventListener('popstate', () => {
    const slug = location.hash.slice(1) || 'home';
    navigate(slug, { pushHistory: false });
  });

  /* ---------- Form handler (demo, no backend yet) ---------- */
  async function handleSubmit(e) {
    e.preventDefault();
    const form = e.currentTarget;
    const status = form.querySelector('.status');
    const data = Object.fromEntries(new FormData(form).entries());

    status.textContent = 'Sending...';
    status.className = 'status';

    if (!data.name.trim() || !data.email.trim() || !data.message.trim()) {
      status.textContent = '❌ Please fill in all fields.';
      status.className = 'status err';
      return;
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)) {
      status.textContent = '❌ That email looks invalid.';
      status.className = 'status err';
      return;
    }

    // Demo mode — replace with fetch(ENDPOINT, { ... }) when backend is ready
    await delay(600);
    status.textContent = '✅ Request sent (demo mode — no server connected yet).';
    status.className = 'status ok';
    form.reset();
  }

  /* ---------- Boot sequence ---------- */
  async function boot() {
    // Preload all pages into RAM (small site — instant navigation)
    for (const slug of Object.keys(PAGES)) {
      pageCache.set(slug, buildPage(slug));
    }

    // Let the boot screen finish its progress bar
    await delay(1500);

    // Determine initial page from hash
    const initialHash = (location.hash.slice(1)) || 'home';
    const initialSlug = pageCache.has(initialHash) ? initialHash : 'home';

    // Swap in the first page (animation plays behind the boot screen)
    swapTo(pageCache.get(initialSlug));
    currentSlug = initialSlug;

    // Normalize URL
    history.replaceState({ slug: initialSlug }, '', '#' + initialSlug);

    // Hide boot screen shortly after the page starts sliding in
    setTimeout(() => {
      document.getElementById('boot').classList.add('hidden');
    }, 120);
  }

  boot();
  </script>
</body>
</html>
